variables:
  APP_ID: io.gitlab.zehkira.Monophony
  MAIN_BRANCH: master # Main development branch into which feature branches are merged
  FLATPAK_BRANCH: master # Branch of exported flatpak repo, same as in flatpakref file
  IMAGE: alpine:3.23.3


stages:
  - test
  - build-x86_64
  - build-aarch64
  - deploy


test:
  stage: test
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $MAIN_BRANCH
  image: ${IMAGE}
  script:
    - apk add appstream bash desktop-file-utils flatpak flatpak-builder gettext git libarchive-tools make py3-pip

    - python3 -m venv .venv
    - source .venv/bin/activate
    - python3 -m pip install -r source/requirements-dev.txt
    - ruff check source
    - deactivate

    - appstreamcli validate --explain --strict source/data/metainfo.xml
    - desktop-file-validate source/data/*.desktop
    - make --directory=source/ translation
    - >
      if ! (git diff --exit-code); then
        echo "[ERROR] Translation template is outdated - run 'make translation'";
        false
      fi
    - >
      if (find source/locales/ | tr "\n" " " | grep -q "\.mo"); then
        echo "[ERROR] *.mo files committed - delete them"
        false
      fi
    - >
      if (cat $(find . -name "*.svg") | grep -q "inkscape:"); then
        echo "[ERROR] SVG files are not plain - re-export as plain"
        false
      fi

    - make --directory=source/ flatpak
    - flatpak run --filesystem=$CI_PROJECT_DIR/source/tests/:ro --command=source/tests/tests.py --env=MONOPHONY_LOG_LEVELS=ERRO ${APP_ID} --verbose


.build:
  image: ${IMAGE}
  script:
    - apk add flatpak flatpak-builder libarchive-tools

    - flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

    - gpg --list-keys --with-keygrip
    - echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
    - gpg-connect-agent reloadagent /bye
    - cat $GPG_PASSPHRASE | /usr/libexec/gpg-preset-passphrase --preset $GPG_KEY_GREP
    - gpg --import --batch ${GPG_PRIVATE_KEY}

    - flatpak-builder build --arch=${ARCH} --user --install-deps-from=flathub --gpg-sign=${GPG_KEY_ID} --disable-rofiles-fuse --disable-updates --force-clean --repo=repo --default-branch=${FLATPAK_BRANCH} $CI_PROJECT_DIR/source/data/manifest.json
    - flatpak build-bundle --arch=${ARCH} --gpg-sign=${GPG_KEY_ID} repo ${APP_ID}.flatpak --runtime-repo=flathub ${APP_ID} ${FLATPAK_BRANCH}
    - flatpak build-update-repo --gpg-sign=${GPG_KEY_ID} --generate-static-deltas --prune repo/
  artifacts:
    paths:
      - repo


build-x86_64:
  extends: .build
  stage: build-x86_64
  rules:
    - if: $CI_COMMIT_BRANCH == $MAIN_BRANCH
      when: manual
  manual_confirmation: 'Build and deploy?'
  variables:
    ARCH: x86_64


build-aarch64:
  extends: .build
  stage: build-aarch64
  rules:
    - if: $CI_COMMIT_BRANCH == $MAIN_BRANCH
  variables:
    ARCH: aarch64


pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $MAIN_BRANCH
  image: ${IMAGE}
  script:
    - apk add rsync

    - mkdir --parents public
    - rsync -av --exclude='public' --exclude='.git' ${CI_PROJECT_DIR}/repo/ public
  artifacts:
    paths:
      - public
